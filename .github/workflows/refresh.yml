name: Refresh

# Fetch a dated ClinicalTrials.gov snapshot, publish it as Release data-<date> and
# pin that tag in SNAPSHOT on main. The pin commit is the deploy: Vercel's Git build
# picks it up (D10a). Weekly (D9), Mondays 04:00 UTC.
#
# GitHub disables scheduled workflows after 60 days without repository activity
# (https://docs.github.com/en/actions/managing-workflow-runs-and-deployments/managing-workflow-runs/disabling-and-enabling-a-workflow).
# The weekly pin commit is meant to count as that activity; whether a GITHUB_TOKEN
# commit does is unverified. If the schedule stops, re-enable it in the Actions tab.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: uv sync --frozen
      - run: mise run fetch
      # Fails without changing anything if today's release already exists.
      - run: mise run snapshot
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit the SNAPSHOT pin to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SNAPSHOT
          git commit -m "chore(snapshot): pin $(cat SNAPSHOT)"
          git pull --rebase origin main  # main may have moved during the fetch
          git push origin HEAD:main
      # Reports success and failure alike, from the owner's dedicated bot (not mario's).
      - name: Notify Telegram
        if: always()
        run: >-
          uv run --frozen python -m trial_results_tracker notify
          --status "${{ job.status }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --previous "$(git show "$GITHUB_SHA:SNAPSHOT")"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
