# The one check definition: per-file at commit, tests at push, whole-repo in CI.
# Local hooks call the mise-managed binaries, so versions live only in mise.toml.
default_stages: [pre-commit] # otherwise stage-less hooks also fire on push

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
      - id: gitleaks
        name: gitleaks (staged)
        entry: gitleaks git --staged --redact --verbose
        language: system
        pass_filenames: false
      - id: tests
        name: tests
        entry: mise run test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push] # commit hooks already did the static checks
